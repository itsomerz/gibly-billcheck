name: Supabase keep-alive

# Supabase's free tier pauses a project after ~7 days with no API
# activity, and a paused project can't be resumed via API -- only from the
# dashboard (resuming can take a few minutes, and the API can still 521 for
# a bit after it looks active).
#
# INCIDENT (2026-11-08): this job had been pinging successfully twice a
# week (Wed/Sat) and the project still paused -- it was already paused by
# Nov 4, just 4 days after the last successful ping on Oct 31, well inside
# the stated 7-day window. Root cause unconfirmed (Supabase doesn't
# publish exactly what counts as "activity" for pause purposes, so a
# single read-only endpoint may not be enough). Manually resumed from the
# dashboard 2026-11-08. Mitigation: (a) run daily instead of twice a week,
# shrinking the exposure window, and (b) hit two different tables per run
# instead of one. If it still pauses on this cadence, the next escalation
# is Pro ($25/mo), which has no pause behavior at all.
on:
  schedule:
    # Daily ~08:13 UTC.
    - cron: "13 8 * * *"
  workflow_dispatch: {} # manual "Run workflow" button in the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Supabase (keep project active)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl -sS -f \
            -H "apikey: $NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/rate_proposals?select=id&limit=1"
          curl -sS -f \
            -H "apikey: $NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/rate_alerts?select=id&limit=1"
